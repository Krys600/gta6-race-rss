name: Update feed

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 minutes, off the busy :00 slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python3 scripts/build_feed.py

      - name: Commit and push if entries changed
        run: |
          # New file, or a change outside the lastBuildDate line.
          if git ls-files --error-unmatch feed.xml >/dev/null 2>&1 \
             && git diff --quiet -I'<lastBuildDate>' -- feed.xml; then
            echo "No content change (ignoring lastBuildDate); nothing to commit."
            git checkout -- feed.xml
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update feed"
          git push
